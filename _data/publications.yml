- title: "Biological invasions negatively impact global protected areas"
  authors: "Carneiro, L., Miiller, N. O. R., Cuthbert, R. N., & Vitule, J. R. S."
  venue: "Science of The Total Environment, 174823"
  year: 2024
  doi: "https://doi.org/10.1016/j.scitotenv.2024.174823"
  lead: true
  note: "First global quantitative synthesis of what invasive species do inside protected areas: 300 reported effects from 44 species."
  abstract: >
    Protected areas underpin global biodiversity conservation and sustainability agendas. Biological invasions increasingly threaten the ecological functioning and long-term conservation value of protected areas, while a lack of information on impact impedes management decisions. We collated data from effects of biological invasions in protected areas to provide the first quantitative analysis of their global impacts. Based on 300 reported effects from 44 invasive species, we show that there are overall negative impacts from invasive species on both biotic and abiotic characteristics of protected areas globally. Impacts were pervasive across population, community, and ecosystem scales, and for the vast majority of invasive taxa with sufficient data. Negative impacts have been incurred around the world, with National Parks and World Heritage Sites in the Neartic and Neotropical regions the most studied. Notwithstanding context-dependencies and uneven research efforts, the recurrent negative impacts of invasive species indicate that current efforts are insufficient to curb current stressors and meet conservation and sustainability targets on land and in water. To address the risk of biological invasions in protected areas, it is imperative to prioritise fundamental research on ecological interactions, establish robust monitoring and prevention programs, and raise awareness through global initiatives.

- title: "Benefits do not balance costs of biological invasions"
  authors: "Carneiro, L., Hulme, P. E., Cuthbert, R. N., Kourantidou, M., Bang, A., Haubrock, P. J., Bradshaw, C. J. A., Balzani, P., Bacher, S., Latombe, G., Bodey, T. W., Probert, A. F., Quilodrán, C. S., & Courchamp, F."
  venue: "BioScience 74, 340–344"
  year: 2024
  doi: "https://doi.org/10.1093/biosci/biae010"
  lead: true
  note: "Argues that the occasional benefits of invasive species cannot be netted off against their costs, because the two fall on different people at different times."
  abstract: >
    Biological invasions have profound impacts on biodiversity and ecosystem functioning and services, resulting in substantial economic and health costs estimated in the trillions of dollars. Preventing and managing biological invasions are vital for sustainable development, aligning with the goals of the United Nations Biodiversity Conference. However, some invasive species also offer occasional benefits, leading to divergent perceptions among stakeholders and sectors. Claims that invasion science overlooks positive contributions threaten to hinder proper impact assessment and undermine management. Quantitatively balancing benefits and costs is misleading, because they coexist without offsetting each other. Any benefits also come at a price, affecting communities and regions differently over time. An integrated approach considering both costs and benefits is necessary for understanding and effective management of biological invasions.

- title: "A systematic review of invasive non-native freshwater bivalves"
  authors: "Prestes, J. G., Carneiro, L., Miiller, N. O. R., Neundorf, A. K. A., Pedroso, C. R., Braga, R. R., et al."
  venue: "Biological Reviews"
  year: 2024
  doi: "https://doi.org/10.1111/brv.13113"
  note: "Reviews a decade of research on non-native freshwater bivalves and shows how thin the evidence still is outside a handful of species and regions."
  abstract: >
    The introduction of invasive species has become an increasing environmental problem in freshwater ecosystems due to the high economic and ecological impacts it has generated. This systematic review covers publications from 2010 to 2020, focusing on non-native invasive freshwater bivalves, a particularly relevant and widespread introduced taxonomic group in fresh waters. We collected information on the most studied species, the main objectives of the studies, their geographical location, study duration, and type of research. Furthermore, we focused on assessing the levels of ecological evidence presented, the type of interactions of non-native bivalves with other organisms and the classification of their impacts. A total of 397 publications were retrieved. The studies addressed a total of 17 species of non-native freshwater bivalves; however, most publications focused on the species Corbicula fluminea and Dreissena polymorpha, which are recognised for their widespread distribution and extensive negative impacts. Many other non-native invasive bivalve species have been poorly studied. A high geographical bias was also present, with a considerable lack of studies in developing countries.

- title: "Taming the terminological tempest in invasion science"
  authors: "Soto, I., Balzani, P., Carneiro, L., Cuthbert, R. N., Macêdo, R., Serhan Tarkan, A., et al."
  venue: "Biological Reviews"
  year: 2024
  doi: "https://doi.org/10.1111/brv.13071"
  note: "Proposes a simplified, standardised vocabulary for invasion science, translated into 28 languages."
  abstract: >
    Standardised terminology in science is important for clarity of interpretation and communication. In invasion science — a dynamic and rapidly evolving discipline — the proliferation of technical terminology has lacked a standardised framework for its development. Here, we review and evaluate the multiple terms used in invasion science to propose a more simplified and standardised terminology, based on the terms non-native, established non-native and invasive non-native, and propose a protocol for classifying populations based on dispersal mechanism, species origin, population status, and impact.

