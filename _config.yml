  name: "Laís Carneiro"
  links:
    - https://orcid.org/0000-0002-3828-7751
    - https://scholar.google.com/citations?user=rUvrtAsAAAAJ
    - https://github.com/lalacarneiro
    - https://www.linkedin.com/in/laiscarneiro/
    - https://www.researchgate.net/profile/Lais-Carneiro
